<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>BharatChat</title>
  <style>
    body {
      margin: 0;
      background-color: #1C1C1E;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #F3F4F6;
      text-align: center;
      padding: 24px;
      box-sizing: border-box;
    }
    .logo {
      width: 96px;
      height: 96px;
      border-radius: 24px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      margin-bottom: 24px;
    }
    .title {
      font-size: 20px;
      font-weight: 600;
      color: #E09115;
      margin-bottom: 8px;
    }
    .status {
      font-size: 14px;
      color: #9CA3AF;
      margin-bottom: 24px;
      max-width: 280px;
      line-height: 1.5;
    }
    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(224, 145, 21, 0.2);
      border-top-color: #E09115;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 20px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .btn-retry {
      display: inline-block;
      background: #E09115;
      color: #1C1C1E;
      font-weight: 600;
      font-size: 14px;
      padding: 10px 24px;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      text-decoration: none;
      box-shadow: 0 4px 12px rgba(224, 145, 21, 0.3);
    }
  </style>
</head>
<body>
  <img src="icon-192.png" alt="BharatChat" class="logo">
  <div class="spinner"></div>
  <div class="title">Connecting to BharatChat...</div>
  <div class="status" id="status-text">Connecting to server. Please check your internet connection.</div>
  <button class="btn-retry" onclick="tryConnect()">Retry Connection</button>

  <script>
    const TARGET_URL = 'https://bharat-chat-app-vqn8.vercel.app';
    let attempts = 0;

    function tryConnect() {
      attempts++;
      const el = document.getElementById('status-text');
      if (el) el.innerText = 'Connecting... (attempt ' + attempts + ')';
      window.location.replace(TARGET_URL);
    }

    // Try automatically immediately and periodically
    setTimeout(tryConnect, 100);
    setInterval(tryConnect, 4000);
  </script>
</body>
</html>
