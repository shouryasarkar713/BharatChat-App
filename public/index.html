<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>BharatChat</title>
  <style>
    body {
      margin: 0;
      background-color: #1C1C1E;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #E09115;
    }
    .logo {
      width: 96px;
      height: 96px;
      border-radius: 24px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      margin-bottom: 24px;
    }
    .spinner {
      width: 28px;
      height: 28px;
      border: 3px solid rgba(224, 145, 21, 0.2);
      border-top-color: #E09115;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
  <script>
    window.location.replace('https://bharat-chat-app-vqn8.vercel.app');
  </script>
</head>
<body>
  <img src="icon-192.png" alt="BharatChat" class="logo">
  <div class="spinner"></div>
</body>
</html>
